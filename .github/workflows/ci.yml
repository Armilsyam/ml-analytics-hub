name: Python Data Science CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Check dengan Flake8 (Deteksi Syntax Error)
        run: |
          # Hentikan build jika ada syntax error atau undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Pemeriksaan gaya penulisan standar
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Smoke Test Modul & Inisialisasi SQLite
        run: |
          python -c "import app; app.init_db(); print('Verifikasi modul & SQLite sukses!')"
